<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alineación de Mockup 2D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0d0714',
                        primary: '#8b5cf6',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body {
            background-color: #0d0714;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .workspace {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 2000px;
        }

        /* La imagen de fondo del mockup */
        .mockup-image {
            position: absolute;
            max-width: 1200px;
            z-index: 10;
            pointer-events: none; /* Para poder hacer hover en la UI si queremos */
            opacity: 0.8; /* Un poco transparente para ver qué pasa atrás */
        }

        /* El contenedor de nuestra UI que vamos a deformar para que encaje */
        .ui-screen {
            position: absolute;
            width: 1024px; /* Ancho base típico de una pantalla */
            height: 640px; /* Alto base típico de una pantalla */
            background-color: #1a1525;
            border: 2px solid #8b5cf6;
            z-index: 5;
            transform-style: preserve-3d;
            transform-origin: center center;
            /* Estos valores se sobreescriben con JS desde los controles */
            transform: translateX(0px) translateY(0px) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1);
        }

        /* Estilos del panel de control */
        .controls-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(20, 15, 30, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 12px;
            z-index: 100;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-group label {
            font-size: 11px;
            font-family: monospace;
            text-transform: uppercase;
            color: #a78bfa;
            display: flex;
            justify-content: space-between;
        }

        .control-group input[type="range"] {
            width: 100%;
            accent-color: #8b5cf6;
        }

        #css-output {
            background: #000;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
            color: #10b981;
            white-space: pre-wrap;
            word-break: break-all;
            margin-top: 10px;
            user-select: all;
        }
    </style>
</head>
<body>

    <div class="workspace">
        
        <!-- Nuestra UI que vamos a encajar (Dashboard Falso) -->
        <div class="ui-screen" id="uiScreen">
            <!-- UI Dummy para tener referencia visual -->
            <div class="w-full h-full flex flex-col p-6 gap-6 relative overflow-hidden">
                <div class="absolute inset-0 bg-[url('/grid.svg')] opacity-20"></div>
                
                <header class="flex justify-between items-center relative z-10">
                    <div class="h-8 w-32 bg-white/10 rounded"></div>
                    <div class="flex gap-4">
                        <div class="h-8 w-8 bg-white/10 rounded-full"></div>
                        <div class="h-8 w-8 bg-white/10 rounded-full"></div>
                    </div>
                </header>

                <div class="grid grid-cols-3 gap-6 relative z-10 flex-1">
                    <div class="col-span-2 bg-white/5 rounded-xl border border-white/10 p-6 flex flex-col gap-4">
                        <div class="h-6 w-48 bg-white/10 rounded"></div>
                        <div class="flex-1 bg-white/5 rounded"></div>
                    </div>
                    <div class="col-span-1 flex flex-col gap-6">
                        <div class="flex-1 bg-white/5 rounded-xl border border-white/10 p-6"></div>
                        <div class="flex-1 bg-white/5 rounded-xl border border-white/10 p-6"></div>
                    </div>
                </div>
                
                <div class="absolute inset-0 border-[4px] border-dashed border-red-500 pointer-events-none opacity-50"></div>
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-red-500 font-mono font-bold text-2xl opacity-50">AREA DE PANTALLA</div>
            </div>
        </div>

        <!-- EL MOCKUP PNG (Debe ir por encima para que el marco tape los bordes de la UI) -->
        <!-- Asegurate de que la ruta sea correcta. -->
        <img src="/mockuphero.png" alt="Mockup" class="mockup-image" id="mockupImg">

    </div>

    <!-- PANEL DE CONTROLES -->
    <div class="controls-panel">
        <h3 class="text-white font-bold text-sm mb-2">Ajuste de Perspectiva CSS</h3>
        
        <div class="control-group">
            <label><span>Translate X</span> <span id="val-tx">0px</span></label>
            <input type="range" id="tx" min="-800" max="800" value="0">
        </div>
        <div class="control-group">
            <label><span>Translate Y</span> <span id="val-ty">0px</span></label>
            <input type="range" id="ty" min="-800" max="800" value="0">
        </div>
        <div class="control-group">
            <label><span>Scale</span> <span id="val-sc">1</span></label>
            <input type="range" id="sc" min="0.1" max="2" step="0.01" value="1">
        </div>
        <div class="control-group">
            <label><span>Rotate X</span> <span id="val-rx">0deg</span></label>
            <input type="range" id="rx" min="-90" max="90" value="0">
        </div>
        <div class="control-group">
            <label><span>Rotate Y</span> <span id="val-ry">0deg</span></label>
            <input type="range" id="ry" min="-90" max="90" value="0">
        </div>
        <div class="control-group">
            <label><span>Rotate Z</span> <span id="val-rz">0deg</span></label>
            <input type="range" id="rz" min="-180" max="180" value="0">
        </div>
        <div class="control-group">
            <label><span>Skew X</span> <span id="val-skx">0deg</span></label>
            <input type="range" id="skx" min="-45" max="45" value="0">
        </div>
        <div class="control-group">
            <label><span>Skew Y</span> <span id="val-sky">0deg</span></label>
            <input type="range" id="sky" min="-45" max="45" value="0">
        </div>
        
        <div class="control-group mt-2">
            <label><span>Ancho de Pantalla</span> <span id="val-w">1024px</span></label>
            <input type="range" id="w" min="300" max="2000" value="1024">
        </div>
        <div class="control-group">
            <label><span>Alto de Pantalla</span> <span id="val-h">640px</span></label>
            <input type="range" id="h" min="300" max="2000" value="640">
        </div>
        
        <div class="mt-4">
            <span class="text-xs text-gray-400">CSS Resultante (copiá esto):</span>
            <div id="css-output"></div>
        </div>
    </div>

    <script>
        const uiScreen = document.getElementById('uiScreen');
        const mockupImg = document.getElementById('mockupImg');
        const cssOutput = document.getElementById('css-output');

        const controls = ['tx', 'ty', 'sc', 'rx', 'ry', 'rz', 'skx', 'sky', 'w', 'h'];
        
        function updateTransform() {
            const tx = document.getElementById('tx').value;
            const ty = document.getElementById('ty').value;
            const sc = document.getElementById('sc').value;
            const rx = document.getElementById('rx').value;
            const ry = document.getElementById('ry').value;
            const rz = document.getElementById('rz').value;
            const skx = document.getElementById('skx').value;
            const sky = document.getElementById('sky').value;
            const w = document.getElementById('w').value;
            const h = document.getElementById('h').value;

            document.getElementById('val-tx').innerText = tx + 'px';
            document.getElementById('val-ty').innerText = ty + 'px';
            document.getElementById('val-sc').innerText = sc;
            document.getElementById('val-rx').innerText = rx + 'deg';
            document.getElementById('val-ry').innerText = ry + 'deg';
            document.getElementById('val-rz').innerText = rz + 'deg';
            document.getElementById('val-skx').innerText = skx + 'deg';
            document.getElementById('val-sky').innerText = sky + 'deg';
            document.getElementById('val-w').innerText = w + 'px';
            document.getElementById('val-h').innerText = h + 'px';

            uiScreen.style.width = w + 'px';
            uiScreen.style.height = h + 'px';

            const transformStr = `translate3d(${tx}px, ${ty}px, 0) scale(${sc}) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) skew(${skx}deg, ${sky}deg)`;
            uiScreen.style.transform = transformStr;

            cssOutput.innerText = `width: ${w}px;\nheight: ${h}px;\ntransform: ${transformStr};`;
        }

        controls.forEach(id => {
            document.getElementById(id).addEventListener('input', updateTransform);
        });

        // Initialize
        updateTransform();
    </script>
</body>
</html>
